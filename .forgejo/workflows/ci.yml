name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint + format check
        run: bun run lint

      # Unit suite only. The live integration tier (test/integration.test.ts)
      # self-skips without TEST_SOURCE_DB_URL / TEST_TARGET_DB_URL, so it is a
      # no-op here; the `integration` job below runs it under real Postgres.
      - name: Unit tests
        run: bun test

      # Source + docs claims the lexicanum e2e guides make about this repo.
      # No network, no transcript - the timeless regression subset.
      - name: Verify source + docs claims
        run: bash scripts/verify-claims.sh

  # Verify the standalone binary compiles and runs (the release matrix
  # cross-compiles the same entrypoint; catch breakage before a tag).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun build ./src/cli.ts --compile --outfile pgmig
      - run: ./pgmig --version

  # Assert every Supabase Management API (method, path) pgmig calls still
  # exists in the live OpenAPI spec - fail loudly on upstream rename/removal
  # instead of a runtime 404 mid-migration.
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun run scripts/check-api-drift.ts

  # Real logical replication against a throwaway Postgres pair (Docker), plus the
  # negative-path safety-gate assertions. ubuntu-latest ships docker + compose v2.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Private Docker daemon for this job. The runner's shared host socket
      # resolves bind mounts and published ports on the router, not in this
      # container, so tests that mount the workspace or dial localhost need
      # their own daemon (runs as root under a privileged runner; vfs avoids nested overlay).
      - name: Start job-private dockerd
        run: |
          sh -c 'dockerd --host=unix:///tmp/dind.sock --data-root=/tmp/dind-data --storage-driver=vfs >/tmp/dockerd.log 2>&1 &'
          for i in $(seq 1 30); do docker -H unix:///tmp/dind.sock info >/dev/null 2>&1 && break; sleep 1; done
          echo "DOCKER_HOST=unix:///tmp/dind.sock" >> "$GITHUB_ENV"
          docker -H unix:///tmp/dind.sock info --format 'private dockerd: {{.ServerVersion}} {{.Driver}}'
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # Install host deps ONCE up front. `bun start rehearse integration` runs the
      # CLI on the host (it shells out to docker compose), so node_modules must
      # already exist - otherwise the first `bun start` auto-installs and a later
      # `bun install --frozen-lockfile` collides on the .bin symlinks (EEXIST).
      - run: bun install --frozen-lockfile

      # Live replication + fault injection (lose-row, corrupt-row, drop-replica-identity,
      # generated-col exclusion). Stands up + tears down its own compose network.
      - name: Integration tier
        run: bun start rehearse integration

      # Bootstrap tier: REAL pg_dumpall/pg_dump/psql. Unlike replication it only
      # dumps from the source URL and restores to the target URL (no walreceiver
      # cross-container dial), so two published-port containers + the host's bun
      # and pg client are enough. postgresql-client must be >= the server major
      # (16) or pg_dump refuses. Exercises BOTH the generic path and the forced
      # Supabase-filter path (filterSupabaseRoles / filterSupabaseSchema).
      - name: Bootstrap tier (real pg_dump/psql)
        run: |
          set -euo pipefail
          # The runner image is Ubuntu 22.04 (distro client = 14, older than the
          # PG16 servers below, so pg_dump refuses). Install 16 from PGDG.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          docker run -d --name boot-src -e POSTGRES_PASSWORD=pw -p 55432:5432 postgres:16 -c wal_level=logical
          docker run -d --name boot-tgt -e POSTGRES_PASSWORD=pw -p 55433:5432 postgres:16
          export TEST_SOURCE_DB_URL="postgresql://postgres:pw@127.0.0.1:55432/postgres"
          export TEST_TARGET_DB_URL="postgresql://postgres:pw@127.0.0.1:55433/postgres"
          for u in "$TEST_SOURCE_DB_URL" "$TEST_TARGET_DB_URL"; do
            for i in $(seq 1 60); do psql "$u" -tAc 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          done
          psql --version
          bun test test/bootstrap.integration.test.ts

      - name: Bootstrap tier teardown
        if: always()
        run: docker rm -f boot-src boot-tgt || true

      # Safety gates must FIRE, not just exist. Each harness mode exits non-zero if its
      # gate does not trip, so a green step is proof the gate works. Small ROWS for speed.
      - name: 'Safety gate: concurrent write load (reconcile must pass, ledger clean)'
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            -e ROWS=20000 -e WRITE_LOAD=1 -e WRITE_INTERVAL_MS=2 -e WRITE_AFTER_SEC=4 runner \
            sh -c 'bun install --frozen-lockfile && bun run test/scale.harness.ts'

      - name: 'Safety gate: WAL watchdog must abort on bloat'
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            -e ROWS=1000 -e WATCHDOG_FIRE=1 -e WATCHDOG_MB=8 -e BLOAT_ROWS=4000 runner \
            sh -c 'bun install --frozen-lockfile && bun run test/scale.harness.ts'

      - name: 'Safety gate: cutover must refuse under live writes'
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            -e ROWS=20000 -e WRITE_THROUGH_CUTOVER=1 runner \
            sh -c 'bun install --frozen-lockfile && bun run test/scale.harness.ts'

      - name: Tear down compose
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  # Heterogeneous (Debezium, no-Kafka) engines end-to-end. SEPARATE from the PG jobs on purpose:
  # it builds + runs the pinned PRE-RELEASE Debezium Server image against real MySQL / SQL Server,
  # so it is slower and a red here must NEVER gate the stable PG core above. Both engines are now
  # harness-proven (MySQL + SQL Server both had green end-to-end runs here), so both steps gate the
  # job - a regression in either should show red.
  # Both harnesses stand up + tear down their own compose network (see test/heterogeneous/README.md).
  heterogeneous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Private Docker daemon for this job. The runner's shared host socket
      # resolves bind mounts and published ports on the router, not in this
      # container, so tests that mount the workspace or dial localhost need
      # their own daemon (runs as root under a privileged runner; vfs avoids nested overlay).
      - name: Start job-private dockerd
        run: |
          sh -c 'dockerd --host=unix:///tmp/dind.sock --data-root=/tmp/dind-data --storage-driver=vfs >/tmp/dockerd.log 2>&1 &'
          for i in $(seq 1 30); do docker -H unix:///tmp/dind.sock info >/dev/null 2>&1 && break; sleep 1; done
          echo "DOCKER_HOST=unix:///tmp/dind.sock" >> "$GITHUB_ENV"
          docker -H unix:///tmp/dind.sock info --format 'private dockerd: {{.ServerVersion}} {{.Driver}}'
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # The harnesses shell out to `docker build` / `docker compose` and import postgres + mssql,
      # so host node_modules must exist before they run.
      - run: bun install --frozen-lockfile

      - name: 'MySQL to Postgres harness (beta - gating)'
        run: bun run test/heterogeneous/harness.ts

      - name: 'SQL Server to Postgres harness (beta - gating)'
        run: bun run test/heterogeneous/harness-sqlserver.ts

      - name: Debezium container logs (on failure)
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}' || true
          for c in $(docker ps -a --format '{{.Names}}' | grep -E 'dbz|debezium' || true); do
            echo "=== $c"; docker logs --tail 80 "$c" 2>&1 || true
          done
