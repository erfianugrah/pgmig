name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Build all targets
        run: |
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            bun build ./src/cli.ts --compile --target=$t --outfile pgmig-$t
          done
      - name: Generate SHA256 checksums
        run: sha256sum pgmig-* > SHA256SUMS
      - name: Ensure gh CLI
        run: |
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" pgmig-* SHA256SUMS -R erfianugrah/pgmig --generate-notes
